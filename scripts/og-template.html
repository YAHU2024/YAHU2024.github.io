<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo';
        src: url(data:font/woff2;base64,__FONT_B64__) format('woff2');
        font-weight: 400 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0a0e1a;
        font-family: 'Archivo', 'Microsoft YaHei', sans-serif;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 96px;
      }
      .b {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .b1 {
        width: 520px;
        height: 520px;
        background: #7c3aed;
        opacity: 0.3;
        top: -140px;
        left: -80px;
      }
      .b2 {
        width: 460px;
        height: 460px;
        background: #22d3ee;
        opacity: 0.26;
        bottom: -160px;
        right: -60px;
      }
      .b3 {
        width: 380px;
        height: 380px;
        background: #7dd3fc;
        opacity: 0.16;
        top: 140px;
        right: 200px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        position: relative;
      }
      h1 {
        font-size: 132px;
        font-weight: 800;
        color: #f1f5fb;
        letter-spacing: -2px;
        line-height: 1;
        position: relative;
      }
      .dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #7dd3fc;
        display: inline-block;
        margin-left: 12px;
        position: relative;
      }
      .sub {
        margin-top: 36px;
        font-size: 40px;
        font-weight: 600;
        color: #b9c4d8;
        position: relative;
      }
      .foot {
        position: absolute;
        left: 96px;
        bottom: 88px;
        font-size: 24px;
        color: #7f8ca3;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="b b1"></div>
    <div class="b b2"></div>
    <div class="b b3"></div>
    <div class="brand"><h1>YAHU</h1><span class="dot"></span></div>
    <div class="sub">把日常做成顺手的软件</div>
    <div class="foot">yahu2024.github.io · github.com/YAHU2024</div>
  </body>
</html>
